services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    # Supply the runtime env contract (see .env.example). Without DATABASE_URL,
    # BETTER_AUTH_SECRET and BETTER_AUTH_URL the container boots but auth and the
    # database fail immediately, so the contract is required, not optional.
    env_file:
      - .env.local
